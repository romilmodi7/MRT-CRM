name: employee_chat
description: MRT CRM - employee chat, private chat and more - Mindripple Technologies
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^1.0.5
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  open_filex: ^4.5.0
  permission_handler: ^12.0.0
  record: ^6.0.0
  just_audio: ^0.9.40
  video_player: ^2.9.1
  geolocator: ^13.0.2
  photo_manager: ^3.6.0
  crypto: ^3.0.5
  url_launcher: ^6.3.1
  android_intent_plus: ^5.2.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_icon.png
    - assets/logo_full.png
