name: Build MRT CRM APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.mindrippletech --project-name employee_chat .
      - name: Apply overlay (manifest, MainActivity, icons)
        run: |
          rm -rf android/app/src/main/res/drawable-v21
          cp -r android_overlay/app/src/main/* android/app/src/main/
          rm -f android/app/src/main/kotlin/com/mindrippletech/employee_chat/MainActivity.kt.bak
          pip install pillow
          python3 tool/make_icons.py
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
      - name: Force app name MRT CRM and show it in the log
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MRT CRM"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
      - name: Allow newer plugins (compile every module against Android 36)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          gradle.beforeProject { p ->
            p.afterEvaluate {
              def a = p.extensions.findByName('android')
              if (a != null) { a.compileSdkVersion(36) }
              // Android lint crashes on some plugins (LintDriver RuntimeException) and is not needed to make the APK
              try { if (a != null) { a.lint.checkReleaseBuilds = false; a.lint.abortOnError = false } } catch (Throwable t) { }
              p.tasks.matching { it.name.startsWith('lint') }.configureEach { it.enabled = false }
            }
          }
          EOF
      - name: Same signing key for every build (needed so a new APK installs over the old one)
        run: |
          mkdir -p ~/.android
          cp android_overlay/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - name: Build (version = app_version.txt, e.g. 1.0.2; build number = the number of this run)
        run: |
          V=$(tr -d ' \r\n' < app_version.txt 2>/dev/null || true)
          V=${V:-1.0.0}
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "Building version $V (build number ${{ github.run_number }})"
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=$V --dart-define=BUILD=${{ github.run_number }} --dart-define=VERSION=$V
      - name: Files for the in-app update (upload both to storage/app/appupdate on the server)
        run: |
          mkdir -p update
          cp build/app/outputs/flutter-apk/app-release.apk update/app.apk
          printf '{\n  "code": %s,\n  "name": "%s",\n  "force": false,\n  "notes": "Bug fixes and improvements."\n}\n' "${{ github.run_number }}" "$APP_VERSION" > update/version.json
          cat update/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: mrt-crm-apk
          path: update
