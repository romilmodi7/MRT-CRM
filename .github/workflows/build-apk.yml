name: Build MRT CRM APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org com.mindrippletech --project-name employee_chat .
      - name: Apply overlay (manifest, MainActivity, icons)
        run: |
          rm -rf android/app/src/main/res/drawable-v21
          cp -r android_overlay/app/src/main/* android/app/src/main/
          rm -f android/app/src/main/kotlin/com/mindrippletech/employee_chat/MainActivity.kt.bak
          pip install pillow
          python3 tool/make_icons.py
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
      - name: Force app name MRT CRM and show it in the log
        run: |
          sed -i 's/android:label="[^"]*"/android:label="MRT CRM"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
      - name: Allow newer plugins (compile every module against Android 36)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          gradle.beforeProject { p ->
            p.afterEvaluate {
              def a = p.extensions.findByName('android')
              if (a != null) { a.compileSdkVersion(36) }
            }
          }
          EOF
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mrt-crm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
